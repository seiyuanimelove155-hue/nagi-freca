<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>なぎ🐬🫧のフレカ置き場</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      color: #687586;

      background:
        linear-gradient(
          180deg,
          #f2fcff 0%,
          #faf5ff 50%,
          #fff5fb 100%
        );

      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       ヘッダー
    ========================= */

    header {
      position: relative;
      text-align: center;
      padding: 28px 45px 18px;
    }

    .site-title {
      margin: 0;

      color: #6daabd;

      font-size: clamp(22px, 6vw, 32px);
      font-weight: 700;

      line-height: 1.25;

      white-space: nowrap;
    }

    .site-description {
      margin: 9px 0 0;

      color: #929baa;

      font-size: 12px;
      line-height: 1.6;
      white-space: nowrap;
    }

    /* =========================
       ？ボタン
    ========================= */

    .help-button {
      position: absolute;

      top: 10px;
      right: 10px;

      width: 34px;
      height: 34px;

      border-radius: 50%;

      border: 1px solid #cde8ef;

      background: #ffffff;

      color: #6caabd;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 12px rgba(100, 160, 180, 0.12);
    }

    /* =========================
       メイン
    ========================= */

    main {
      width: min(720px, 100%);

      margin: 0 auto;

      padding:
        4px 12px 50px;
    }

    /* =========================
       キャラクター
    ========================= */

    .character-list {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;

      margin:
        8px 0 18px;
    }

    .character-button {
      border: 1px solid #d9edf2;

      border-radius: 20px;

      background:
        rgba(255,255,255,0.82);

      padding:
        10px 5px 9px;

      color: #778391;

      cursor: pointer;

      box-shadow:
        0 4px 14px rgba(120,170,190,0.08);

      transition:
        0.2s ease;
    }

    .character-button.active {
      border-color: #a9dce8;

      background:
        linear-gradient(
          135deg,
          #e9fbff,
          #fff0fa
        );

      box-shadow:
        0 5px 16px rgba(120,170,190,0.14);
    }

    .character-icon {
      width: 62px;
      height: 62px;

      display: block;

      margin: 0 auto;

      border-radius: 50%;

      object-fit: cover;

      border: 3px solid white;

      box-shadow:
        0 4px 10px rgba(120,170,190,0.18);
    }

    .character-name {
      margin-top: 6px;

      font-size: 13px;
      font-weight: 600;
    }

    /* =========================
       検索
    ========================= */

    .search-box {
      margin-bottom: 17px;
    }

    .search-input {
      width: 100%;

      border:
        1px solid #d8ebf0;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.9);

      padding:
        12px 17px;

      color: #687586;

      outline: none;

      box-shadow:
        0 4px 14px rgba(120,170,190,0.07);
    }

    .search-input::placeholder {
      color: #aeb7c0;
    }

    .search-input:focus {
      border-color: #a8dce8;
    }

    /* =========================
       キャラクター見出し
    ========================= */

    .character-heading {
      text-align: center;

      margin:
        7px 0 15px;
    }

    .character-heading h2 {
      margin: 0;

      color: #6f8fa4;

      font-size: 19px;
    }

    .card-count {
      margin: 4px 0 0;

      color: #a6afb9;

      font-size: 11px;
    }

    /* =========================
       フレカ一覧
    ========================= */

    .card-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 13px;
    }

    .card-item {
      overflow: hidden;

      border:
        1px solid rgba(255,255,255,0.9);

      border-radius: 18px;

      background:
        rgba(255,255,255,0.9);

      box-shadow:
        0 6px 18px rgba(120,150,180,0.12);

      cursor: pointer;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .card-item:active {
      transform: scale(0.98);
    }

    .card-image {
      width: 100%;

      aspect-ratio: 1 / 1.42;

      display: block;

      object-fit: cover;

      background:
        linear-gradient(
          135deg,
          #e5faff,
          #fff0fa
        );
    }

    .card-info {
      padding:
        9px 9px 11px;

      text-align: center;
    }

    .coordinate-name {
      margin: 0;

      color: #68758a;

      font-size: 13px;
      font-weight: 600;

      line-height: 1.45;

      word-break: break-word;
    }

    .card-description {
      margin:
        3px 0 0;

      color: #a2aab5;

      font-size: 10px;
    }

    /* =========================
       メッセージ
    ========================= */

    .message {
      grid-column: 1 / -1;

      text-align: center;

      padding: 30px 10px;

      color: #9ca6b1;

      font-size: 13px;
    }

    /* =========================
       モーダル
    ========================= */

    .modal {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 18px;

      background:
        rgba(75, 88, 105, 0.38);

      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(100%, 440px);

      max-height: 90vh;

      overflow-y: auto;

      padding: 19px;

      border-radius: 24px;

      background: white;

      box-shadow:
        0 18px 55px rgba(70,90,110,0.25);

      position: relative;
    }

    .modal-close {
      position: absolute;

      top: 9px;
      right: 10px;

      width: 34px;
      height: 34px;

      border: none;

      border-radius: 50%;

      background: #f4f7f9;

      color: #77818c;

      font-size: 19px;

      cursor: pointer;
    }

    /* =========================
       フレカ詳細
    ========================= */

    .detail-image {
      width: 100%;

      max-height: 72vh;

      object-fit: contain;

      display: block;

      margin:
        27px auto 12px;

      border-radius: 15px;

      background: #f8f8fa;
    }
    .qr-image {
  max-height: 50vh;
  margin-top: 18px;
}

    .detail-title {
      margin: 0;

      text-align: center;

      color: #6e7890;

      font-size: 16px;
    }

    /* =========================
       使い方
    ========================= */

    .help-title {
      margin:
        4px 0 17px;

      text-align: center;

      color: #6f9bad;

      font-size: 19px;
    }

    .help-section {
      border:
        1px solid #d9edf2;

      border-radius: 16px;

      padding:
        11px 13px;

      margin-bottom: 10px;

      background:
        linear-gradient(
          135deg,
          #fbfeff,
          #fffafd
        );
    }

    .help-section-title {
      margin: 0 0 4px;

      color: #70a4b6;

      font-size: 13px;
      font-weight: 700;
    }

    .help-section-text {
      margin: 0;

      color: #7d8792;

      font-size: 12px;

      line-height: 1.7;
    }

    /* =========================
       PC
    ========================= */

    @media (min-width: 700px) {

      .card-grid {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
      }

      .character-icon {
        width: 70px;
        height: 70px;
      }
    }

    @media (max-width: 390px) {

      .site-title {
        font-size: 21px;
      }

      .site-description {
        font-size: 12px;
      }

      .character-icon {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       ヘッダー
  ========================== -->

  <header>

    <button
      id="helpButton"
      class="help-button"
      aria-label="このサイトの使い方"
    >
      ?
    </button>

    <h1 class="site-title">
      なぎ🐬🫧のフレカ置き場
    </h1>

    <p class="site-description">
      アイプリのフレンドカードを見つけやすくまとめています
    </p>

  </header>


  <main>

    <!-- キャラクター -->

    <section
      id="characterList"
      class="character-list"
    >
      <div class="message">
        キャラクターを読み込み中…
      </div>
    </section>


    <!-- 検索 -->

    <section class="search-box">

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="コーデ名で検索…"
      >

    </section>


    <!-- 現在のキャラクター -->

    <section class="character-heading">

      <h2 id="characterHeading">
        フレカ一覧
      </h2>

      <p
        id="cardCount"
        class="card-count"
      ></p>

    </section>


    <!-- フレカ -->

    <section
      id="cardGrid"
      class="card-grid"
    >

      <div class="message">
        フレカを読み込み中…
      </div>

    </section>

  </main>


  <!-- =========================
       フレカ詳細
  ========================== -->

  <div
    id="cardModal"
    class="modal"
  >

    <div class="modal-box">

      <button
        id="cardModalClose"
        class="modal-close"
      >
        ×
      </button>

      <img
        id="detailImage"
        class="detail-image"
        src=""
        alt=""
      >
      <img
        id="detailQrImage"
        class="qr-image"
        src=""
        alt="QRコード"
      >

      <h3
        id="detailTitle"
        class="detail-title"
      ></h3>

    </div>

  </div>


  <!-- =========================
       使い方
  ========================== -->

  <div
    id="helpModal"
    class="modal"
  >

    <div class="modal-box">

      <button
        id="helpModalClose"
        class="modal-close"
      >
        ×
      </button>

      <h2 class="help-title">
        このサイトの使い方🫧
      </h2>


      <div class="help-section">

        <p class="help-section-title">
          キャラクターを選ぶ
        </p>

        <p class="help-section-text">
          上のキャラクターを選ぶと、
          そのマイキャラのフレカを表示できます。
        </p>

      </div>


      <div class="help-section">

        <p class="help-section-title">
          コーデ名から探す
        </p>

        <p class="help-section-text">
          検索欄にコーデ名を入力すると、
          該当するフレカを探せます。
        </p>

      </div>


      <div class="help-section">

        <p class="help-section-title">
          フレカを見る
        </p>

        <p class="help-section-text">
          気になるフレカをタップすると、
          大きな画像で確認できます。
        </p>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       Supabase設定
    ===================================================== */

    const SUPABASE_URL =
      "https://yftzzqjqveqvhskdvsea.supabase.co";


    /*
      ★★★ ここだけ変更 ★★★

      下の文字を、さっきSupabaseでコピーした
      「anon / public」のキーに置き換えてください。

      ※ sb_secret_ から始まるSecret keyは入れない。
    */

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmdHp6cWpxdmVxdmhza2R2c2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MzU3MjksImV4cCI6MjEwMjQxMTcyOX0.mv2SzPylt139bRZU85qbhfUoW8Rzyv_hVH9WYTGNEdM";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================================
       状態
    ===================================================== */

    let characters = [];

    let cards = [];

    let selectedCharacterId = null;

    let searchWord = "";


    /* =====================================================
       HTMLエスケープ
    ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =====================================================
       キャラクター読み込み
    ===================================================== */

    async function loadCharacters() {

      const container =
        document.getElementById(
          "characterList"
        );


      const { data, error } =
        await supabaseClient
          .from("characters")
          .select("*")
          .order(
            "sort_order",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "characters error:",
          error
        );

        container.innerHTML = `
          <div class="message">
            キャラクターを読み込めませんでした。
          </div>
        `;

        return;
      }


      characters = data || [];


      if (characters.length === 0) {

        container.innerHTML = `
          <div class="message">
            キャラクターが登録されていません。
          </div>
        `;

        return;
      }


      container.innerHTML = "";


      characters.forEach(
        (character, index) => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "character-button";


          const characterName =
            character.name ||
            character.character_name ||
            "キャラクター";


          button.innerHTML = `

            <img
              class="character-icon"
              src="${escapeHtml(
                character.image_url || ""
              )}"
              alt="${escapeHtml(
                characterName
              )}"
            >

            <div class="character-name">
              ${escapeHtml(
                characterName
              )}
            </div>

          `;


          button.addEventListener(
            "click",
            () => {

              selectedCharacterId =
                character.id;


              document
                .querySelectorAll(
                  ".character-button"
                )
                .forEach(
                  element =>
                    element.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              updateCharacterHeading();

              renderCards();
            }
          );


          container.appendChild(
            button
          );


          /*
            最初のキャラクターを
            自動選択
          */

          if (index === 0) {

            selectedCharacterId =
              character.id;

            button.classList.add(
              "active"
            );
          }

        }
      );


      updateCharacterHeading();


      await loadCards();
    }


    /* =====================================================
       フレカ読み込み
    ===================================================== */

    async function loadCards() {

      const container =
        document.getElementById(
          "cardGrid"
        );


      container.innerHTML = `
        <div class="message">
          フレカを読み込み中…
        </div>
      `;


      const { data, error } =
        await supabaseClient
          .from("cards")
          .select("*")
          .order(
            "sort_order",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "cards error:",
          error
        );


        container.innerHTML = `
          <div class="message">
            フレカを読み込めませんでした。
          </div>
        `;

        return;
      }


      cards = data || [];


      renderCards();
    }


    /* =====================================================
       コーデ名を取得
    ===================================================== */

    function getCoordinateName(card) {

      return (
        card.coordinate_name ||
        card.coodinate_name ||
        card.coordinate ||
        card.outfit_name ||
        card.card_name ||
        card.name ||
        "コーデ名未設定"
      );
    }


    /* =====================================================
       フレカ表示
    ===================================================== */

    function renderCards() {

      const container =
        document.getElementById(
          "cardGrid"
        );


      const filteredCards =
        cards.filter(card => {


          /*
            キャラクター
          */

          if (
            selectedCharacterId !== null &&
            String(
              card.character_id
            ) !== String(
              selectedCharacterId
            )
          ) {

            return false;
          }


          /*
            検索
          */

          if (
            searchWord.trim() !== ""
          ) {

            const coordinateName =
              getCoordinateName(
                card
              ).toLowerCase();


            if (
              !coordinateName.includes(
                searchWord
                  .trim()
                  .toLowerCase()
              )
            ) {

              return false;
            }

          }


          return true;
        });


      document.getElementById(
        "cardCount"
      ).textContent =
        filteredCards.length > 0
          ? `${filteredCards.length}枚`
          : "";


      if (
        filteredCards.length === 0
      ) {

        container.innerHTML = `
          <div class="message">
            該当するフレカがありません
          </div>
        `;

        return;
      }


      container.innerHTML = "";


      filteredCards.forEach(
        card => {

          const item =
            document.createElement(
              "article"
            );


          item.className =
            "card-item";


          const coordinateName =
            getCoordinateName(
              card
            );


          item.innerHTML = `

            <img
              class="card-image"
              src="${escapeHtml(
                card.image_url || ""
              )}"
              alt="${escapeHtml(
                coordinateName
              )}"
              loading="lazy"
            >

            <div class="card-info">

              <p class="coordinate-name">
                ${escapeHtml(
                  coordinateName
                )}
              </p>

              ${
                card.description
                  ? `
                    <p class="card-description">
                      ${escapeHtml(
                        card.description
                      )}
                    </p>
                  `
                  : ""
              }

            </div>

          `;


          item.addEventListener(
            "click",
            () => {

                openCardModal(
                    card.qr_image_url,
                    coordinateName
                );

            }
          );


          container.appendChild(
            item
          );

        }
      );
    }


    /* =====================================================
       キャラクター見出し
    ===================================================== */

    function updateCharacterHeading() {

      const character =
        characters.find(
          character =>
            String(
              character.id
            ) === String(
              selectedCharacterId
            )
        );


      const name =
        character
          ? (
              character.name ||
              character.character_name ||
              ""
            )
          : "";


      document.getElementById(
        "characterHeading"
      ).textContent =
        name
          ? `${name}のフレカ`
          : "フレカ一覧";
    }


    /* =====================================================
       検索
    ===================================================== */

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        event => {

          searchWord =
            event.target.value;

          renderCards();

        }
      );


    /* =====================================================
       フレカ詳細モーダル
    ===================================================== */

    function openCardModal(
  imageUrl,
  qrImageUrl,
  title
) {

  document.getElementById(
    "detailImage"
  ).src =
    imageUrl || "";


  document.getElementById(
    "detailImage"
  ).alt =
    title || "";


  const qrImage =
    document.getElementById(
      "detailQrImage"
    );


  if (qrImageUrl) {

    qrImage.src =
      qrImageUrl;

    qrImage.style.display =
      "block";

  } else {

    qrImage.src =
      "";

    qrImage.style.display =
      "none";

  }


  document.getElementById(
    "detailTitle"
  ).textContent =
    title || "";


  document.getElementById(
    "cardModal"
  ).classList.add(
    "show"
  );
}


    /* =====================================================
       使い方モーダル
    ===================================================== */

    document
      .getElementById(
        "helpButton"
      )
      .addEventListener(
        "click",
        () => {

          document
            .getElementById(
              "helpModal"
            )
            .classList.add(
              "show"
            );

        }
      );


    document
      .getElementById(
        "helpModalClose"
      )
      .addEventListener(
        "click",
        () => {

          document
            .getElementById(
              "helpModal"
            )
            .classList.remove(
              "show"
            );

        }
      );


    /* =====================================================
       モーダル外側をタップして閉じる
    ===================================================== */

    document
      .querySelectorAll(
        ".modal"
      )
      .forEach(
        modal => {

          modal.addEventListener(
            "click",
            event => {

              if (
                event.target === modal
              ) {

                modal.classList.remove(
                  "show"
                );

              }

            }
          );

        }
      );


    /* =====================================================
       ESCキー
    ===================================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          document
            .querySelectorAll(
              ".modal"
            )
            .forEach(
              modal =>
                modal.classList.remove(
                  "show"
                )
            );

        }

      }
    );


    /* =====================================================
       開始
    ===================================================== */

    loadCharacters();

  </script>

</body>
</html>
